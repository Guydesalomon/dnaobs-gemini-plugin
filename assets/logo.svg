<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="helixA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="helixB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="96" stroke="#1e293b" stroke-width="4"/>

  <!-- Orbital Ring / Observatory Motif -->
  <circle cx="256" cy="220" r="140" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 12" opacity="0.35"/>
  <circle cx="256" cy="220" r="110" stroke="#0d9488" stroke-width="1.5" opacity="0.4"/>

  <!-- Base Pair Rungs -->
  <g opacity="0.75" stroke="#94a3b8" stroke-width="3" stroke-linecap="round">
    <line x1="206" y1="130" x2="306" y2="150"/>
    <line x1="186" y1="175" x2="326" y2="175"/>
    <line x1="206" y1="220" x2="306" y2="200"/>
    <line x1="256" y1="250" x2="256" y2="250"/>
    <line x1="306" y1="280" x2="206" y2="300"/>
    <line x1="326" y1="325" x2="186" y2="325"/>
  </g>

  <!-- Helix Strand 1 -->
  <path d="M196 110C240 140 280 180 326 220C280 260 240 300 196 340" stroke="url(#helixA)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Helix Strand 2 -->
  <path d="M316 110C272 140 232 180 186 220C232 260 272 300 316 340" stroke="url(#helixB)" stroke-width="12" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Node Spheres -->
  <circle cx="196" cy="110" r="9" fill="#38bdf8"/>
  <circle cx="316" cy="110" r="9" fill="#2dd4bf"/>
  <circle cx="326" cy="220" r="10" fill="#0d9488"/>
  <circle cx="186" cy="220" r="10" fill="#38bdf8"/>
  <circle cx="196" cy="340" r="9" fill="#2563eb"/>
  <circle cx="316" cy="340" r="9" fill="#38bdf8"/>

  <!-- Brand Typography -->
  <text x="256" y="415" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="2">DNAObs</text>
  <text x="256" y="445" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="6">GENOME OBSERVATORY</text>
</svg>
